[package]
name = "node-release-notes-native"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2", version = "=0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
chrono = { version = "0.4", features = ["clock"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

tempfile = "3"

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
semver = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
